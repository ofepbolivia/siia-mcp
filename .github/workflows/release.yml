name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build binary
        env:
          CGO_ENABLED: "1"
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/package
          version="${RELEASE_TAG#v}"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" -o dist/package/siiasql ./cmd/siiasql
          cp README.md LICENSE dist/package/
          tar -C dist/package -czf "dist/siiasql_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: siiasql_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/siiasql_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: generate checksums
        run: |
          cd dist
          LC_ALL=C sha256sum *.tar.gz > checksums.txt
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
